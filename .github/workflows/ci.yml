name: ci

# One pipeline per push: lint and tests run side by side on a single
# dependency install each, and deploy runs only once both pass on main.
# Actions › ci › Run workflow with "force" ticked deploys main even if a
# check is red — for hotfixes, not habit.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if lint or tests fail
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install -q --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Pint
        run: vendor/bin/pint --test

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npx eslint .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: ./vendor/bin/pest

  deploy:
    needs: [lint, tests]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && needs.lint.result == 'success' && needs.tests.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.force || (needs.lint.result == 'success' && needs.tests.result == 'success')))
      )
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Check deploy settings
        env:
          SSH_KEY_SET: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          ok=1
          for v in SSH_HOST SSH_USER DEPLOY_PATH; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty. Add it to Settings > Environments > production (DEPLOY_PATH as a variable, SSH_* as secrets)."; ok=0; fi
          done
          [ "$SSH_KEY_SET" = "true" ] || { echo "::error::SSH_PRIVATE_KEY secret is empty."; ok=0; }
          case "$DEPLOY_PATH" in /*) ;; *) echo "::error::DEPLOY_PATH must be an absolute path like /home/<user>/nilo-app, got '$DEPLOY_PATH'"; ok=0;; esac
          echo "DEPLOY_PATH=$DEPLOY_PATH  PHP_BIN=$PHP_BIN  port set: $([ -n "$SSH_PORT" ] && echo yes)"
          [ "$ok" = 1 ]

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION || '8.3' }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Build frontend assets
        env:
          VITE_APP_NAME: ${{ vars.APP_NAME || 'Nilo' }}
        run: |
          npm ci
          npm run build

      - name: Name the release
        id: release
        run: echo "name=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host target
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          CFG

      - name: Upload release
        run: |
          RELEASE_DIR="$DEPLOY_PATH/releases/${{ steps.release.outputs.name }}"
          ssh target "echo connected as \$(whoami); command -v rsync >/dev/null || { echo 'rsync missing on server'; exit 1; }; mkdir -p '$RELEASE_DIR'"
          rsync -az --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/storage/' \
            --exclude='/.env' \
            --exclude='/public/storage' \
            --exclude='/public/hot' \
            ./ "target:$RELEASE_DIR/"

      - name: Activate release
        run: |
          ssh target "bash '$DEPLOY_PATH/releases/${{ steps.release.outputs.name }}/deploy/activate-release.sh' \
            '$DEPLOY_PATH' '${{ steps.release.outputs.name }}' '$PHP_BIN'"

      - name: Smoke test
        if: vars.APP_URL != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "${{ vars.APP_URL }}/login")
          echo "GET /login -> $code"
          test "$code" = "200"
